[project]
name = "cybertwin-backend"
version = "0.1.0"
description = "CyberTwin: graph-based cybersecurity digital twin (simulation only)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.163.1",
  "uvicorn[standard]>=0.54.0",
  "pydantic>=2.14.3",
  "pydantic-settings>=2.16.3",
  "networkx>=3.7",
  "sqlalchemy[asyncio]>=2.1.8",
  "alembic>=1.20.1",
  "aiosqlite>=0.22.1",
  "httpx>=0.28.1",
  "structlog>=26.1.0",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.32.0"]

[dependency-groups]
dev = [
  "pytest>=9.2.0",
  "pytest-asyncio>=1.5.0",
  "pytest-cov>=7.1.0",
  "ruff>=0.17.5",
  "mypy>=2.4.1",
  "respx>=0.23.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"app/ai/*" = ["RUF001"]
"app/i18n/*" = ["RUF001", "E501"]  # TR / AZ catalogs: dotless i, long sentences
"app/api/reports.py" = ["E501", "RUF001"]
"scripts/*" = ["RUF001", "E501", "ASYNC240"]
"tests/api/test_structured.py" = ["RUF001"]
"tests/api/test_api.py" = ["RUF001"]  # Turkish error-message assertions
"tests/api/test_ai.py" = ["RUF001"]  # Turkish fallback-text assertions
"tests/i18n/*" = ["RUF001"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
known-first-party = ["app", "tests"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["networkx", "networkx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["live: hits a real local LLM provider (Ollama); skipped when unreachable"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning"]

[tool.coverage.run]
concurrency = ["greenlet", "thread"]
source = ["app"]
