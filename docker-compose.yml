# CyberTwin Compose Stack (Updated: 2026-11-17)
# CyberTwin: backend (FastAPI) + frontend (nginx serving the Vite build, proxying /api).
# Optional local LLM: docker compose --profile ollama up
services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/cybertwin.db
      CORS_ORIGINS: http://localhost:8080
      AI_PROVIDER: ${AI_PROVIDER:-none}
      AI_MODEL: ${AI_MODEL:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
    volumes:
      - cybertwin-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      retries: 5

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

  # Optional PostgreSQL for the migration + API-test run against Postgres:
  #   docker compose --profile postgres up -d postgres
  #   (host port: CT_PG_PORT, default 5433)
  #   CT_TEST_DATABASE_URL=postgresql+asyncpg://cybertwin:cybertwin@localhost:5433/cybertwin uv run pytest tests/api
  # To run the app itself on it: docker compose -f docker-compose.yml -f docker-compose.postgres.yml --profile postgres up
  postgres:
    image: postgres:17-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: cybertwin
      POSTGRES_PASSWORD: cybertwin
      POSTGRES_DB: cybertwin
    ports:
      - "${CT_PG_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cybertwin -d cybertwin"]
      interval: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama

volumes:
  cybertwin-data:
  ollama-models:
